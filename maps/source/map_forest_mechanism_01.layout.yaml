# Phế Tích Vô Danh — first real map (assets plan §8.2).
# West → east: safe outpost → forest path → wolf/fox hills → robot ruins + elite
# → boss arena → portal home. Run `pnpm maps:build` after editing.
id: map_forest_mechanism_01
name: Phế Tích Vô Danh
seed: 20261006
bounds: { min: { x: -80, z: -48 }, max: { x: 80, z: 48 } }
chunkSize: 32
ground:
  color: "#5b7f43"
  # Grass varies in tone; roads and camps are painted so the route reads at a glance.
  paint:
    variation: ["#6f9a4a", "#476d36", "#7f8f49"]
    noiseScale: 16
    noiseAmount: 0.75
    pathColor: "#8b6f4a"
    pathWidthScale: 0.75
    patches:
      - { center: { x: -68, z: 0 }, radius: 9, color: "#8a7655" } # outpost
      - { center: { x: -34, z: 16 }, radius: 6, color: "#6f6a45" } # wolf den
      - { center: { x: -24, z: -24 }, radius: 6, color: "#7a6a45" } # fox burrows
      - { center: { x: 16, z: 22 }, radius: 9, color: "#6e675d" } # robot ruins
      - { center: { x: 24, z: -26 }, radius: 7, color: "#77694d" } # elite yard
      - { center: { x: 60, z: 0 }, radius: 13, color: "#7b7466", edge: 3 } # boss arena
      - { center: { x: 22, z: 34 }, radius: 4, color: "#6e675d" } # dungeon gate
playerSpawn: { x: -70, z: 0 }
arrivals:
  - { id: from_town, position: { x: -68, z: 2 } }
  - { id: from_sanctum, position: { x: 22, z: 32 } }

paths:
  - width: 7
    points:
      - { x: -76, z: 0 }
      - { x: -48, z: 6 }
      - { x: -26, z: -2 }
      - { x: -4, z: 4 }
      - { x: 18, z: -2 }
      - { x: 44, z: 0 }
      - { x: 76, z: 0 }
  # Branches to the side camps
  - width: 5
    points: [{ x: -26, z: -2 }, { x: -24, z: -24 }]
  - width: 5
    points: [{ x: 18, z: -2 }, { x: 16, z: 22 }]
  - width: 5
    points: [{ x: 18, z: -2 }, { x: 24, z: -26 }]

clearings:
  - { center: { x: -68, z: 0 }, radius: 10 } # outpost
  - { center: { x: -34, z: 16 }, radius: 7 } # wolf den
  - { center: { x: -24, z: -24 }, radius: 7 } # fox burrows
  - { center: { x: 16, z: 22 }, radius: 9 } # robot ruins
