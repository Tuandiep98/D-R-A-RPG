# Phế Tích Vô Danh — lớp ngoài di tích (master plan §11: hang cổ, tượng đá, phù
# văn, linh thú; tầng sâu: cửa hợp kim, terminal). World region_tan_nguyen.
# Tây → đông: Doanh Trại Tiền Tiêu (safe) → rừng → Đồi Sói / Hang Hồ Ly →
# Cửa Hợp Kim (phế tích + xác máy Thiên Cơ) + Linh Lộc Đài → Đài Tượng Đá (boss)
# → cổng về trấn. Gameplay (paths/zones/spawns/portals) giữ nguyên khi trùng tu;
# dressing theo docs/map_authoring_rules.md. Chạy `pnpm content:build` sau khi sửa.
id: map_forest_mechanism_01
name: Phế Tích Vô Danh
seed: 20261008
bounds: { min: { x: -80, z: -48 }, max: { x: 80, z: 48 } }
chunkSize: 32
