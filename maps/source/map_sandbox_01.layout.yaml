# Tân Nguyên Trấn — thị trấn biên giới, vùng khởi đầu (master plan §11, world
# region_tan_nguyen). Trùng tu theo docs/plan/05_map_renovation_plan.md và
# docs/map_authoring_rules.md:
#   - Quảng trường giữa (bia Thiên Cơ + cờ Thiên Kiếm Minh), 4 khu theo góc:
#     Lò rèn (TB) · Chợ nhỏ (ĐB) · Y quán (ĐN) · Doanh trại (TN);
#   - Trạm vận chuyển ở cổng nam, hàng rào gỗ bao quanh, 4 cổng theo 2 trục đường;
#   - Ngoài cổng bắc: Bãi Luyện Công (Thạch Khôi, tây) và Bãi Xác Máy (Cơ Giáp
#     Trinh Sát, đông), đường bắc dẫn tới cổng Phế Tích Vô Danh.
# +Z = bắc. Chạy `pnpm content:build` sau khi sửa.
id: map_sandbox_01
name: Tân Nguyên Trấn
seed: 1101
bounds: { min: { x: -40, z: -40 }, max: { x: 40, z: 40 } }
chunkSize: 32
ground:
  color: "#5f8a4a"
  paint:
    variation: ["#6f9a4a", "#527a3e", "#7d9450"]
    noiseScale: 12
    noiseAmount: 0.6
    pathColor: "#8b6f4a"
    pathWidthScale: 0.85
    patches:
      - { center: { x: 0, z: 0 }, radius: 10, color: "#9a8467", edge: 2.5 } # quảng trường
      - { center: { x: -15, z: 11 }, radius: 6, color: "#6f5f4a", edge: 2 } # lò rèn
      - { center: { x: 15, z: 10 }, radius: 7, color: "#8f7a5a", edge: 2 } # chợ
      - { center: { x: 15, z: -12 }, radius: 6, color: "#7d8a55", edge: 2 } # y quán (vườn thuốc)
      - { center: { x: -15, z: -13 }, radius: 7, color: "#8a7a5e", edge: 2 } # doanh trại
      - { center: { x: 0, z: -29 }, radius: 7, color: "#7a7468", edge: 2 } # trạm vận chuyển
      - { center: { x: -29, z: 30 }, radius: 7, color: "#77705f", edge: 3 } # bãi luyện công
      - { center: { x: 29, z: 30 }, radius: 7, color: "#6e675d", edge: 3 } # bãi xác máy
playerSpawn: { x: 0, z: -9 }
arrivals:
  - { id: from_forest, position: { x: 0, z: 33 } }

paths:
  # Trục bắc–nam: trạm vận chuyển → quảng trường → cổng bắc → Phế Tích.
  - { width: 7, points: [{ x: 0, z: -39 }, { x: 0, z: 39 }] }
  # Trục đông–tây qua quảng trường.
  - { width: 5, points: [{ x: -39, z: 0 }, { x: 39, z: 0 }] }
  # Ngoài cổng bắc: rẽ hai bãi luyện.
  - { width: 5, points: [{ x: 0, z: 32 }, { x: -14, z: 34 }, { x: -27, z: 30 }] }
  - { width: 5, points: [{ x: 0, z: 32 }, { x: 14, z: 34 }, { x: 27, z: 30 }] }
  # Ngõ vào các khu.
  - { width: 4, points: [{ x: 3, z: -6 }, { x: 11, z: -10 }] }
  - { width: 4, points: [{ x: -3, z: -6 }, { x: -11, z: -11 }] }

clearings:
  - { center: { x: 0, z: 0 }, radius: 33 } # trong hàng rào: chỉ đặt tay
  - { center: { x: -29, z: 30 }, radius: 8 }
  - { center: { x: 29, z: 30 }, radius: 8 }
  - { center: { x: 0, z: 36 }, radius: 4 }

