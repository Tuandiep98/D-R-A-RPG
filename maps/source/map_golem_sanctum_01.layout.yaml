# Huyền Vũ Cổ Mộ — solo dungeon (tech plan §29: one private instance per character).
# Corridor of robot guards → sanctum with a copy of the boss → exit portal.
# Trùng tu: tầng sâu di tích — cửa hợp kim, terminal, mộ thất tường đá nứt,
# trại khảo cổ ở cửa mộ (docs/map_authoring_rules.md).
id: map_golem_sanctum_01
name: Huyền Vũ Cổ Mộ
seed: 777
instance: solo
bounds: { min: { x: -24, z: -40 }, max: { x: 24, z: 40 } }
chunkSize: 32
ground: { color: "#4a4f57" }
playerSpawn: { x: 0, z: -35 }
arrivals:
  - { id: entrance, position: { x: 0, z: -34 } }

paths:
  - width: 8
    points: [{ x: 0, z: -38 }, { x: 0, z: 38 }]

clearings:
  - { center: { x: 0, z: -34 }, radius: 5 }
  - { center: { x: 0, z: 20 }, radius: 13 }

groundCovers:
