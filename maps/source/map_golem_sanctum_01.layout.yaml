      id: sanctum_gate,
      name: Cửa Mộ,
      kind: safe,
      center: { x: 0, z: -35 },
      radius: 4,
    }
  - {
      id: sanctum,
      name: Mộ Thất Hợp Kim,
      kind: boss_arena,
      center: { x: 0, z: 20 },
      radius: 13,
    }

spawns:
  - {
      id: guards_a,
      monsterId: robot_scout_001,
      position: { x: 0, z: -18 },
      count: 3,
      radius: 3,
      respawnSeconds: 600,
    }
  - {
      id: guards_b,
      monsterId: robot_scout_001,
      position: { x: 0, z: -4 },
      count: 3,
      radius: 3,
      respawnSeconds: 600,
